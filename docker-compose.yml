services:
  db:
    image: timescale/timescaledb-ha:pg16
    command: >
      -c max_connections=100
      -c shared_buffers=256MB
      -c idle_in_transaction_session_timeout=30000
      -c idle_session_timeout=60000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_agent}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
    volumes:
      # bind mount to ./data/pg — data persists on host filesystem
      - ~/.tradelogx/data/pg:/home/postgres/pgdata/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - '6432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trade -d trade_agent']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-net

  redis:
    image: redis/redis-stack:7.4.0-v2
    ports:
      - '6379:6379'
      - '8001:8001'  # RedisInsight UI
    volumes:
      - ~/.tradelogx/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agent-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://trade:trade@db:5432/trade_agent
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=300
      - DEFAULT_POOL_SIZE=30
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      - SERVER_IDLE_TIMEOUT=30
      - SERVER_CONNECT_TIMEOUT=3
      - CLIENT_IDLE_TIMEOUT=60         # 空闲 60s 自动断开，防止连接泄漏累积
      - CLIENT_LOGIN_TIMEOUT=30         # 认证握手超时 30s，防止冷启动失败
      - ADMIN_USERS=pgbouncer_admin
      - STATS_USERS=pgbouncer_stats
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      - AUTH_TYPE=scram-sha-256
    ports:
      - "5432:5432"                    # PgBouncer 内部监听 5432，映射到宿主机 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agent-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --no-access-log
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    ports:
      - '8000:8000'
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgbouncer
      - redis
    networks:
      - agent-net

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app worker -l info --concurrency=4 -Q celery,grid_search
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      - WEB_PROXY=socks5://host.docker.internal:7890
      - DATASOURCE_AUTO_WS=false       # WS 行情供给仅 backend 进程需要
      - CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP=true
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgbouncer                      # 依赖 pgbouncer（而非 backend）
    networks:
      - agent-net

  lark-ws:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m apps.channel.lark_ws
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      - DATASOURCE_AUTO_WS=false       # WS 行情供给仅 backend 进程需要
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgbouncer                      # 依赖 pgbouncer（而非 backend）
    networks:
      - agent-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      - DATASOURCE_AUTO_WS=false       # WS 行情供给仅 backend 进程需要
    env_file:
      - ./backend/.env
    depends_on:
      - pgbouncer                      # 依赖 pgbouncer（而非 backend）
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
