services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_agent}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
    volumes:
      # bind mount to ./data/pg — data persists on host filesystem
      - ~/.tradelogx/data/pg:/home/postgres/pgdata/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trade -d trade_agent']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-net

  redis:
    image: redis/redis-stack:7.4.0-v2
    ports:
      - '6379:6379'
      - '8001:8001'  # RedisInsight UI
    volumes:
      - ~/.tradelogx/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agent-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --no-access-log
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    ports:
      - '8000:8000'
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=db
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app worker -l info
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=db
      - WEB_PROXY=socks5://host.docker.internal:7890
      - CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP=true
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - agent-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=db
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
