# 同镜像（backend/Dockerfile）的三个长驻服务共用：
# - backend  : 每条前端 WS 连接 = 1 个 socket + 1 个 Redis 连接
# - celery   : concurrency=2 的多子进程，各自持有 Redis/PG 连接
# - lark-ws  : 长连 WS + Redis Stream 消费
# 容器默认继承 dockerd 的 nofile（常见 1024/2048）。前端页面「挂着不动」时
# 上面这些连接会长时间累积，1024 在挂机数小时后被打满，表现为 accept 报
# EMFILE —— 进程还在、端口还通，但新请求全进不来（与内存 OOM 的
# 「端口通但不响应」是同一个外部形态，排障时极易混淆）。
# soft/hard 同时抬到 65535：只抬 soft 的话进程自己无法再提高上限。
x-backend-nofile: &backend-nofile
  nofile:
    soft: 65535
    hard: 65535

services:
  db:
    restart: unless-stopped
    image: timescale/timescaledb-ha:pg16
    command: >
      -c max_connections=100
      -c shared_buffers=256MB
      -c idle_in_transaction_session_timeout=30000
      -c idle_session_timeout=60000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_agent}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
    volumes:
      # bind mount to ./data/pg — data persists on host filesystem
      - ~/.tradelogx/data/pg:/home/postgres/pgdata/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - '6432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trade -d trade_agent']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-net

  redis:
    restart: unless-stopped
    image: redis/redis-stack:7.4.0-v2
    ports:
      - '6379:6379'
      - '8001:8001'  # RedisInsight UI
    volumes:
      - ~/.tradelogx/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agent-net

  pgbouncer:
    restart: unless-stopped
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://trade:trade@db:5432/trade_agent
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=300
      - DEFAULT_POOL_SIZE=30
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      - SERVER_IDLE_TIMEOUT=30
      - SERVER_CONNECT_TIMEOUT=3
      - CLIENT_IDLE_TIMEOUT=60         # 空闲 60s 自动断开，防止连接泄漏累积
      - CLIENT_LOGIN_TIMEOUT=30         # 认证握手超时 30s，防止冷启动失败
      - ADMIN_USERS=pgbouncer_admin
      - STATS_USERS=pgbouncer_stats
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      - AUTH_TYPE=scram-sha-256
    ports:
      - "5432:5432"                    # PgBouncer 内部监听 5432，映射到宿主机 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agent-net

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --no-access-log
    # 打开文件数上限，见文件末尾 x-backend-common 的注释。
    ulimits: *backend-nofile
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    ports:
      - '8000:8000'
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      # http 协议（非 socks5）：容器内 DNS 对 binance 域名返回 IPv6，socks5 会
      # 在容器侧本地解析后走 v6 隧道（mihomo 路由无 v6 出口）卡死；http CONNECT
      # 把域名交给 mihomo 远端解析（v4），已验证容器内 0.7s 通。
      - WEB_PROXY=http://host.docker.internal:7890
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgbouncer
      - redis
    networks:
      - agent-net

  celery:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 子进程回收是**兜底**，不是主修复（主修复见 handler.py 的日志管道与
    # tasks.py 的 `_scalar_stats`）：
    # - `--max-tasks-per-child`：跑满 N 个任务就换一个新的子进程，把 Python
    #   堆碎片和任何残留的进程内状态（如 `_prev_results`、业务层缓存）一起还回去。
    # - `--max-memory-per-child`：单个子进程 RSS 超过这个数（KB）就在任务边界
    #   被回收。注意这是**每个子进程**的上限，不是容器总量，`--concurrency=4`
    #   时最坏情况是 4 倍。
    # - 容器级 memory limit：让「漏到失控」的表现是容器重启而不是整机 OOM
    #   （旧版这里没有任何 limit，漏内存直接打死宿主机，txy 两次「端口通但不响应」
    #   即此形态）。
    #
    # **`--concurrency` 与主机核数对齐（txy 是 2 核）**：原先是 4，但整机只有 2
    # vCPU（`nproc` = 2，AMD EPYC 9754 切片）——4 个 prefork 子进程在 2 核上互相
    # 抢占，CPU 得不到并行收益，却要多养 2 份「基线常驻」（每个子进程 import 完
    # Django + pandas_ta + ccxt 后约 180MB，实测进程 RSS 268~538MB）。而整机只有
    # 3.6GiB 内存、没有 swap 余量（1.9G swap 已用 800M+）——这才是 11-05 OOM
    # 杀死 uvicorn、11-06 整机卡死的资源底板。核数与内存都指向 2。
    # 若将来扩容到 4+ 核 / 8G+ 内存，再把这里调回 4。
    command: >
      celery -A celery_app worker -l info --concurrency=2 -Q celery,grid_search
      --max-tasks-per-child=50
      --max-memory-per-child=800000
    ulimits: *backend-nofile
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 512M
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      # http 协议（非 socks5）：容器内 DNS 对 binance 域名返回 IPv6，socks5 会
      # 在容器侧本地解析后走 v6 隧道（mihomo 路由无 v6 出口）卡死；http CONNECT
      # 把域名交给 mihomo 远端解析（v4），已验证容器内 0.7s 通。
      - WEB_PROXY=http://host.docker.internal:7890
      - DATASOURCE_AUTO_WS=false       # WS 行情供给仅 backend 进程需要
      - CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP=true
      # 日志管道上界：队列满即丢并计数（见 apps/logging_app/handler.py）。
      # 默认 10000 足够吸收一次日志风暴；让它显式可见，是为了排障时能一眼看出
      # 「丢了多少」（`get_handler_stats()["dropped"]`）。
      - LOG_DB_QUEUE_MAX=10000
      - LOG_DB_BATCH_SIZE=200
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgbouncer                      # 依赖 pgbouncer（而非 backend）
    networks:
      - agent-net

  lark-ws:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m apps.channel.lark_ws
    ulimits: *backend-nofile
    volumes:
      - ./backend:/app
      - ~/.tradelogx:/root/.tradelogx
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      - DATASOURCE_AUTO_WS=false       # WS 行情供给仅 backend 进程需要
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgbouncer                      # 依赖 pgbouncer（而非 backend）
    networks:
      - agent-net

  celery-beat:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - REDIS_URL=redis://redis:6379
      - DB_HOST=pgbouncer              # 连接 PgBouncer（而非 db）
      - DB_PORT=5432                   # PgBouncer 端口
      - DB_CONN_MAX_AGE=0              # 必须 0（transaction mode）
      - DATASOURCE_AUTO_WS=false       # WS 行情供给仅 backend 进程需要
    env_file:
      - ./backend/.env
    depends_on:
      - pgbouncer                      # 依赖 pgbouncer（而非 backend）
    networks:
      - agent-net

  frontend:
    build:
      context: ./frontend/tradeclaw-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
